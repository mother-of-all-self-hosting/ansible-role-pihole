---
- name: Fail if required Pi-hole settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - pihole_uid
    - pihole_gid
    - pihole_hostname
    - pihole_environment_variables_ftlconf_webserver_api_password

# Pi-hole answers every client that reaches it, and Docker publishes a port given
# without an address on all network interfaces, bypassing the host's firewall.
- name: Fail if a Pi-hole DNS port is published without an address
  ansible.builtin.fail:
    msg: >-
      `{{ item }}` (`{{ lookup('vars', item) }}`) needs the address to publish on (e.g. `192.168.1.15:53`).
      Use `0.0.0.0:53` to publish on every IPv4 address of the server.
  when: "lookup('vars', item) | string | length > 0 and ':' not in lookup('vars', item) | string"
  with_items:
    - pihole_container_dns_tcp_bind_port
    - pihole_container_dns_udp_bind_port

- name: Validate Pi-hole Traefik configuration
  when: pihole_container_labels_traefik_enabled | bool
  block:
    - name: Fail if required Pi-hole Traefik settings not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "pihole_container_labels_traefik_hostname", when: true }
        - { "name": "pihole_container_labels_traefik_path_prefix", when: true }
        - { "name": "pihole_container_labels_traefik_middleware_basic_auth_users", when: "{{ pihole_container_labels_traefik_middleware_basic_auth_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `pihole_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if pihole_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          pihole_container_labels_traefik_path_prefix (`{{ pihole_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/pihole`).
      when: "pihole_container_labels_traefik_path_prefix != '/' and pihole_container_labels_traefik_path_prefix[-1] == '/'"
