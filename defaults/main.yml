---
# Project source code URL: https://github.com/pi-hole/docker-pi-hole

pihole_enabled: true

pihole_identifier: pihole
pihole_base_path: "/{{ pihole_identifier }}"
pihole_data_path: "{{ pihole_base_path }}/data"

# renovate: datasource=docker depName=pihole/pihole
pihole_version: 2026.10.1

pihole_uid: ""
pihole_gid: ""

# The hostname at which Pi-hole's web interface is served.
pihole_hostname: ""

# The path at which Pi-hole's web interface is served.
# This value must either be `/` or not end with a slash (e.g. `/pihole`).
pihole_path_prefix: /

pihole_container_image: "{{ pihole_container_image_registry_prefix }}pihole/pihole:{{ pihole_container_image_tag }}"
pihole_container_image_tag: "{{ pihole_version }}"
pihole_container_image_registry_prefix: "{{ pihole_container_image_registry_prefix_upstream }}"
pihole_container_image_registry_prefix_upstream: "{{ pihole_container_image_registry_prefix_upstream_default }}"
pihole_container_image_registry_prefix_upstream_default: docker.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
pihole_container_network: "{{ pihole_identifier }}"

# Control if the container network is deleted on uninstalling.
pihole_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `pihole_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:8080"), or empty string to not expose.
pihole_container_http_host_bind_port: ""

# The port number in the container
pihole_container_http_port: 80

# Specify how the container publishes its TCP DNS port
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:53"), just a port number or an empty string to not expose.
pihole_container_dns_tcp_bind_port: "53"

# Specify how the container publishes its UDP DNS port (as defined by `pihole_container_dns_tcp_bind_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:53"), just a port number or an empty string to not expose.
pihole_container_dns_udp_bind_port: "{{ pihole_container_dns_tcp_bind_port }}"

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
pihole_container_additional_networks: "{{ pihole_container_additional_networks_auto + pihole_container_additional_networks_custom }}"
pihole_container_additional_networks_auto: []
pihole_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
pihole_container_additional_volumes: "{{ pihole_container_additional_volumes_auto + pihole_container_additional_volumes_custom }}"
pihole_container_additional_volumes_auto: []
pihole_container_additional_volumes_custom: []

# pihole_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `pihole_container_labels_additional_labels_custom`.
pihole_container_labels_traefik_enabled: true
pihole_container_labels_traefik_docker_network: "{{ pihole_container_network }}"
pihole_container_labels_traefik_hostname: "{{ pihole_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/pihole`).
pihole_container_labels_traefik_path_prefix: "{{ pihole_path_prefix }}"
pihole_container_labels_traefik_rule: "Host(`{{ pihole_container_labels_traefik_hostname }}`){% if pihole_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ pihole_container_labels_traefik_path_prefix }}`){% endif %}"
pihole_container_labels_traefik_priority: 0
pihole_container_labels_traefik_entrypoints: web-secure
pihole_container_labels_traefik_tls: "{{ pihole_container_labels_traefik_entrypoints != 'web' }}"
pihole_container_labels_traefik_tls_certResolver: default  # noqa var-naming
pihole_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
pihole_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `pihole_container_labels_traefik_additional_request_headers_custom`
pihole_container_labels_traefik_additional_request_headers: "{{ pihole_container_labels_traefik_additional_request_headers_auto | combine(pihole_container_labels_traefik_additional_request_headers_custom) }}"
pihole_container_labels_traefik_additional_request_headers_auto: {}
pihole_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `pihole_container_labels_traefik_additional_response_headers_custom`
pihole_container_labels_traefik_additional_response_headers: "{{ pihole_container_labels_traefik_additional_response_headers_auto | combine(pihole_container_labels_traefik_additional_response_headers_custom) }}"
pihole_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': pihole_http_header_xss_protection} if pihole_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': pihole_http_header_content_type_options} if pihole_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': pihole_http_header_content_security_policy} if pihole_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': pihole_http_header_permissions_policy} if pihole_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': pihole_http_header_strict_transport_security} if pihole_http_header_strict_transport_security and pihole_container_labels_traefik_tls else {})
  }}
pihole_container_labels_traefik_additional_response_headers_custom: {}

# pihole_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `pihole_container_labels_additional_labels_custom`
#
# Example:
# pihole_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
pihole_container_labels_additional_labels: "{{ pihole_container_labels_additional_labels_auto + pihole_container_labels_additional_labels_custom }}"
pihole_container_labels_additional_labels_auto: []
pihole_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
pihole_container_extra_arguments: "{{ pihole_container_extra_arguments_auto + pihole_container_extra_arguments_custom }}"
pihole_container_extra_arguments_auto: []
pihole_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
pihole_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
pihole_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
#
# We intentionally don't set this, because Pi-hole does it and we'd rather not override its (better) value.
pihole_http_header_content_security_policy: ""

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
pihole_http_header_permissions_policy: "{{ 'interest-cohort=()' if pihole_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
pihole_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if pihole_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `pihole_http_header_permissions_policy`
pihole_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `pihole_http_header_strict_transport_security`
pihole_hsts_preload_enabled: false

# List of systemd services that the Pi-hole systemd service depends on
pihole_systemd_required_services_list: "{{ pihole_systemd_required_services_list_default + pihole_systemd_required_services_list_auto + pihole_systemd_required_services_list_custom }}"
pihole_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
pihole_systemd_required_services_list_auto: []
pihole_systemd_required_services_list_custom: []

# List of systemd services that the Pi-hole systemd service wants
pihole_systemd_wanted_services_list: "{{ pihole_systemd_wanted_services_list_default + pihole_systemd_wanted_services_list_auto + pihole_systemd_wanted_services_list_custom }}"
pihole_systemd_wanted_services_list_default: []
pihole_systemd_wanted_services_list_auto: []
pihole_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
pihole_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
pihole_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
pihole_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
pihole_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ pihole_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ pihole_container_stop_grace_time_seconds }} {{ pihole_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ pihole_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ pihole_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ pihole_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ pihole_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ pihole_identifier }} after {{ pihole_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
pihole_environment_variables_tz: UTC

# The password for Pi-hole's web interface and API.
pihole_environment_variables_ftlconf_webserver_api_password: ""

# Controls which DNS queries Pi-hole answers (`dns.listeningMode`).
#
# Pi-hole's own default (`LOCAL`) only answers clients on the subnets of its own network interfaces.
# In a container, that is only the container network, so clients reaching it through the published
# DNS ports would be refused. `ALL` is what Pi-hole recommends for Docker's bridge networking.
pihole_environment_variables_ftlconf_dns_listening_mode: ALL

# Additional environment variables.
#
# Pi-hole reads any of its settings from a `FTLCONF_<section>_<setting>` environment variable
# (e.g. `FTLCONF_dns_upstreams`), which then overrides `pihole.toml` and is locked in the web interface.
pihole_environment_variables_additional_variables: ""

# pihole_restart_necessary controls whether the Pi-hole systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
pihole_restart_necessary: false
