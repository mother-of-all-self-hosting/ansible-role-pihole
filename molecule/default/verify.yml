---
- name: Verify Pi-hole
  hosts: all
  become: true
  gather_facts: false

  vars:
    # This is a role default, but a Jinja-derived one, and a verify play cannot
    # resolve it out of defaults/main.yml - so it is spelled out here.
    pihole_verify_data_path: /pihole/data

    # Published straight from the container, so requests arrive the way
    # Traefik forwards them: with the path prefix already stripped.
    pihole_verify_origin: "http://127.0.0.1:18080"
    pihole_verify_api_url: "{{ pihole_verify_origin }}/api"

    # The unusual values the scenario configures the role with. Written down
    # here rather than read back out of the inventory, so that a verify run
    # compares the running container against something stated, not against
    # whatever the scenario happens to say at the time.
    pihole_verify_uid: 1873
    pihole_verify_gid: 1873
    pihole_verify_hostname: pihole.molecule.local
    pihole_verify_path_prefix: /pihole-ui
    pihole_verify_http_port: 8282
    pihole_verify_password: molecule-password
    pihole_verify_timezone: Asia/Tokyo
    pihole_verify_timezone_abbreviation: JST

    pihole_verify_capabilities:
      - CAP_CHOWN
      - CAP_DAC_OVERRIDE
      - CAP_FOWNER
      - CAP_KILL
      - CAP_NET_BIND_SERVICE
      - CAP_SETFCAP
      - CAP_SETGID
      - CAP_SETUID

    # The local DNS record that the scenario's additional environment variables
    # give Pi-hole, and a name the verification adds to Pi-hole's deny list.
    pihole_verify_local_record_name: molecule.test
    pihole_verify_local_record_address: 203.0.113.10
    pihole_verify_blocked_name: blocked.molecule.test

    # Asks the published UDP port for the A record of the name it is given,
    # with a hand-built DNS packet, because the test container ships neither
    # `dig` nor `nslookup`.
    pihole_verify_dns_query_script: |
      import socket
      import sys

      query = b"\xab\xcd\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00"
      for label in sys.argv[1].split("."):
          query += bytes([len(label)]) + label.encode()
      query += b"\x00\x00\x01\x00\x01"

      sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
      sock.settimeout(5)
      sock.sendto(query, ("127.0.0.1", 53))
      response, _ = sock.recvfrom(4096)

      print("rcode=%d answers=%d address=%s" % (
          response[3] & 0x0F,
          int.from_bytes(response[6:8], "big"),
          socket.inet_ntoa(response[-4:]),
      ))

    pihole_verify_units:
      - pihole.service

  tasks:
    - name: Verify that Pi-hole works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertions
        # below to the version the role really pins.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: pihole_defaults

        # ------------------------------------------------------------------
        # The systemd unit
        # ------------------------------------------------------------------

        - name: Wait for the Pi-hole systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: pihole_services
          until: pihole_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ pihole_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Pi-hole systemd services are active
          ansible.builtin.assert:
            that: pihole_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(pihole_verify_units | zip(pihole_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Pi-hole systemd services log for debugging
          when: pihole_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ pihole_verify_units }}"

        # ------------------------------------------------------------------
        # The web interface and its API
        # ------------------------------------------------------------------

        # A published Docker port with nothing listening behind it resets the
        # connection rather than refusing it, which `uri` reports as status -1.
        # The loop has to survive that, so failures are tolerated here and judged
        # after. Pi-hole generates a random password when it is given none, so a
        # session for this one means the role's password reached it.
        - name: Wait for Pi-hole to accept the role's password (up to 180s)
          ansible.builtin.uri:
            url: "{{ pihole_verify_api_url }}/auth"
            method: POST
            body_format: json
            body:
              password: "{{ pihole_verify_password }}"
          register: pihole_auth
          until: pihole_auth.status == 200
          retries: 36
          delay: 5
          # So that giving up is reported by the assertion below rather than as a
          # raw HTTP error.
          failed_when: false

        - name: Assert Pi-hole accepts the role's password
          ansible.builtin.assert:
            that:
              - pihole_auth.status == 200
              - pihole_auth.json.session.valid | bool
            fail_msg: "Pi-hole did not accept the role's password: {{ pihole_auth.json | default(pihole_auth.status) }}"
            success_msg: "Pi-hole accepts the role's password on port {{ pihole_verify_http_port }}"

        - name: Read what the running Pi-hole reports about its version
          ansible.builtin.uri:
            url: "{{ pihole_verify_api_url }}/info/version"
            method: GET
            headers:
              sid: "{{ pihole_auth.json.session.sid }}"
          register: pihole_version_info

        - name: Assert the running Pi-hole is the version this role installs
          ansible.builtin.assert:
            that: pihole_version_info.json.version.docker.local == pihole_defaults.pihole_version
            fail_msg: "Pi-hole reports {{ pihole_version_info.json.version.docker.local | default('none') }}, expected {{ pihole_defaults.pihole_version }}"
            success_msg: "Pi-hole reports {{ pihole_version_info.json.version.docker.local }}"

        # Pi-hole sends `/` to its web interface only for the name it is told it is
        # served at, and builds that redirect from the path prefix it is told about.
        # Anything else gets a 404.
        - name: Ask Pi-hole for its start page, as Traefik would forward it
          ansible.builtin.uri:
            url: "{{ pihole_verify_origin }}/"
            method: GET
            follow_redirects: none
            headers:
              Host: "{{ pihole_verify_hostname }}"
            status_code: [308]
          register: pihole_start_page

        # Pi-hole sends a relative location, which `uri` reports resolved against
        # the URL it asked, so only the path is compared.
        - name: Assert Pi-hole redirects to its web interface under the path prefix
          ansible.builtin.assert:
            that: (pihole_start_page.location | urlsplit('path')) == pihole_verify_path_prefix ~ '/admin/'
            fail_msg: "Pi-hole redirects its start page to {{ pihole_start_page.location | default('nowhere') }}"
            success_msg: "Pi-hole redirects its start page to {{ pihole_start_page.location }}"

        # ------------------------------------------------------------------
        # What `docker create` was actually told
        # ------------------------------------------------------------------

        - name: Inspect Pi-hole container
          ansible.builtin.command:
            cmd: docker container inspect pihole
          register: pihole_container_raw
          changed_when: false

        - name: Parse the Pi-hole container definition
          ansible.builtin.set_fact:
            pihole_container: "{{ (pihole_container_raw.stdout | from_json)[0] }}"
            pihole_data_mount: >-
              {{ (pihole_container_raw.stdout | from_json)[0].Mounts
                 | selectattr('Destination', 'equalto', '/etc/pihole') | list }}

        - name: Assert that the container keeps only the capabilities the role grants
          ansible.builtin.assert:
            that:
              - pihole_container.HostConfig.CapDrop == ['ALL']
              - pihole_container.HostConfig.CapAdd | sort == pihole_verify_capabilities
            fail_msg: "The container drops {{ pihole_container.HostConfig.CapDrop }} and adds {{ pihole_container.HostConfig.CapAdd }}"
            success_msg: "The container drops every capability, then adds {{ pihole_container.HostConfig.CapAdd | join(', ') }}"

        - name: Assert that the data path is mounted at /etc/pihole
          ansible.builtin.assert:
            that:
              - pihole_data_mount | length == 1
              - pihole_data_mount[0].Source == pihole_verify_data_path
              - pihole_data_mount[0].RW
            fail_msg: "The data path is not mounted as expected: {{ pihole_container.Mounts }}"
            success_msg: "{{ pihole_verify_data_path }} is mounted at /etc/pihole"

        - name: Assert that the container image is the pinned version
          ansible.builtin.assert:
            that: pihole_container.Config.Image == 'docker.io/pihole/pihole:' ~ pihole_defaults.pihole_version
            fail_msg: "The container runs {{ pihole_container.Config.Image }}, not the {{ pihole_defaults.pihole_version }} pinned in defaults/main.yml"
            success_msg: "The container runs {{ pihole_container.Config.Image }}"

        - name: Wait for the Pi-hole container to turn healthy (up to 180s)
          ansible.builtin.command:
            cmd: docker container inspect pihole
          register: pihole_container_health_raw
          until: ((pihole_container_health_raw.stdout | from_json)[0].State.Health.Status | default('')) == 'healthy'
          retries: 36
          delay: 5
          changed_when: false
          failed_when: false

        - name: Assert the Pi-hole container is healthy
          ansible.builtin.assert:
            that: ((pihole_container_health_raw.stdout | from_json)[0].State.Health.Status | default('')) == 'healthy'
            fail_msg: "The container's health is {{ (pihole_container_health_raw.stdout | from_json)[0].State.Health | default('not checked') }}"
            success_msg: "The container is healthy"

        # ------------------------------------------------------------------
        # Traefik labels
        # ------------------------------------------------------------------

        - name: Assert that the Traefik labels describe the configured hostname and path prefix
          ansible.builtin.assert:
            that:
              - pihole_container.Config.Labels['traefik.enable'] == 'true'
              - pihole_container.Config.Labels['traefik.http.routers.pihole.rule'] == 'Host(`' ~ pihole_verify_hostname ~ '`) && PathPrefix(`' ~ pihole_verify_path_prefix ~ '`)'
              - pihole_container.Config.Labels['traefik.http.middlewares.pihole-strip-prefix.stripprefix.prefixes'] == pihole_verify_path_prefix
              - "'pihole-strip-prefix' in pihole_container.Config.Labels['traefik.http.routers.pihole.middlewares'].split(',')"
              - pihole_container.Config.Labels['traefik.http.services.pihole.loadbalancer.server.port'] == pihole_verify_http_port | string
            fail_msg: "The Traefik labels are not what templates/labels.j2 should have produced: {{ pihole_container.Config.Labels }}"
            success_msg: "The Traefik labels route {{ pihole_verify_hostname }}{{ pihole_verify_path_prefix }} to port {{ pihole_verify_http_port }}"

        # Traefik replaces a header the service sends with the one it is told to
        # add, and Pi-hole sends a stricter Content-Security-Policy itself.
        - name: Assert that Traefik is not told to replace Pi-hole's Content-Security-Policy
          ansible.builtin.assert:
            that: "'traefik.http.middlewares.pihole-add-response-headers.headers.customresponseheaders.Content-Security-Policy' not in pihole_container.Config.Labels"
            fail_msg: "The labels set a Content-Security-Policy: {{ pihole_container.Config.Labels }}"
            success_msg: "The labels leave Pi-hole's own Content-Security-Policy alone"

        # ------------------------------------------------------------------
        # What the process inside the container actually sees and does
        # ------------------------------------------------------------------

        # The container starts as root, so its own user says nothing. The image's
        # entrypoint has to have given its `pihole` user the role's uid and gid, and
        # started Pi-hole's DNS and web server (pihole-FTL) as that user.
        - name: Ask the Pi-hole container which timezone and user pihole-FTL runs in
          ansible.builtin.command:
            cmd: docker exec pihole sh -c 'date +%Z; stat -c %u /proc/$(pidof pihole-FTL); stat -c %g /proc/$(pidof pihole-FTL)'
          register: pihole_process_identity
          changed_when: false

        - name: Assert that pihole-FTL runs in the role's timezone, as the role's user
          ansible.builtin.assert:
            that:
              - pihole_process_identity.stdout_lines[0] == pihole_verify_timezone_abbreviation
              - pihole_process_identity.stdout_lines[1] == pihole_verify_uid | string
              - pihole_process_identity.stdout_lines[2] == pihole_verify_gid | string
            fail_msg: >-
              The container reports zone/uid/gid {{ pihole_process_identity.stdout_lines }},
              expected [{{ pihole_verify_timezone_abbreviation }},
              {{ pihole_verify_uid }}, {{ pihole_verify_gid }}]
            success_msg: >-
              pihole-FTL runs in {{ pihole_process_identity.stdout_lines[0] }}
              as {{ pihole_process_identity.stdout_lines[1] }}:{{ pihole_process_identity.stdout_lines[2] }}

        # The DNS server is the point of this role, and it is a separate listener
        # from the web interface. Pi-hole answers this name from the local record,
        # so no upstream DNS server or internet access is involved.
        - name: Resolve the local DNS record through Pi-hole (up to 60s)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - "{{ pihole_verify_dns_query_script }}"
              - "{{ pihole_verify_local_record_name }}"
          register: pihole_dns_local_record
          changed_when: false
          until: "('address=' ~ pihole_verify_local_record_address) in pihole_dns_local_record.stdout"
          retries: 12
          delay: 5

        - name: Assert Pi-hole answered with the local DNS record
          ansible.builtin.assert:
            that:
              - "'rcode=0' in pihole_dns_local_record.stdout"
              - "'answers=1' in pihole_dns_local_record.stdout"
              - "('address=' ~ pihole_verify_local_record_address) in pihole_dns_local_record.stdout"
            fail_msg: "Pi-hole did not answer with the local DNS record ({{ pihole_dns_local_record.stdout }})"
            success_msg: "Pi-hole answered with the local DNS record ({{ pihole_dns_local_record.stdout }})"

        # Blocking is what Pi-hole is for. Adding a name through the API and then
        # seeing the DNS server block it also ties the two listeners together. An
        # earlier verify run against the same instance has added it already.
        - name: Add a name to the Pi-hole deny list
          ansible.builtin.uri:
            url: "{{ pihole_verify_api_url }}/domains/deny/exact"
            method: POST
            headers:
              sid: "{{ pihole_auth.json.session.sid }}"
            body_format: json
            body:
              domain: "{{ pihole_verify_blocked_name }}"
            status_code: [201, 400]
          register: pihole_deny
          failed_when: >-
            pihole_deny.status != 201
            and 'already present' not in (pihole_deny.json | default({})).get('error', {}).get('hint', '')

        - name: Resolve the denied name through Pi-hole (up to 60s)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - "{{ pihole_verify_dns_query_script }}"
              - "{{ pihole_verify_blocked_name }}"
          register: pihole_dns_blocked
          changed_when: false
          until: "'address=0.0.0.0' in pihole_dns_blocked.stdout"
          retries: 12
          delay: 5

        - name: Assert Pi-hole blocked the denied name
          ansible.builtin.assert:
            that:
              - "'rcode=0' in pihole_dns_blocked.stdout"
              - "'answers=1' in pihole_dns_blocked.stdout"
              - "'address=0.0.0.0' in pihole_dns_blocked.stdout"
            fail_msg: "Pi-hole did not block {{ pihole_verify_blocked_name }} ({{ pihole_dns_blocked.stdout }})"
            success_msg: "Pi-hole blocked {{ pihole_verify_blocked_name }} ({{ pihole_dns_blocked.stdout }})"

        # The API could be answering out of memory. Pi-hole keeps its lists in a
        # SQLite database in the directory the role bind-mounts, so the database
        # has to be there, on the host side of the mount, owned by the role's user.
        - name: Look up the Pi-hole gravity database under the role's data path
          ansible.builtin.stat:
            path: "{{ pihole_verify_data_path }}/gravity.db"
          register: pihole_database

        - name: Assert the Pi-hole gravity database lives under the role's data path
          ansible.builtin.assert:
            that:
              - pihole_database.stat.exists
              - pihole_database.stat.uid == pihole_verify_uid
              - pihole_database.stat.gid == pihole_verify_gid
            fail_msg: "{{ pihole_verify_data_path }}/gravity.db is {{ pihole_database.stat }}"
            success_msg: "{{ pihole_verify_data_path }}/gravity.db exists and belongs to {{ pihole_verify_uid }}:{{ pihole_verify_gid }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "pihole_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: pihole_restarts_before
              loop: "{{ pihole_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: pihole_restarts_after
              loop: "{{ pihole_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - pihole_restarts_after.results | map(attribute='status.NRestarts') | list == pihole_restarts_before.results | map(attribute='status.NRestarts') | list
                  - pihole_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in pihole_verify_units | zip(pihole_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in pihole_verify_units | zip(pihole_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in pihole_verify_units | zip(pihole_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Pi-hole verification summary
          ansible.builtin.debug:
            msg:
              - "Pi-hole systemd: {% for unit, state in pihole_verify_units | zip(pihole_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Pi-hole version: {{ pihole_version_info.json.version.docker.local }}"
              - "Pi-hole start page redirect: {{ pihole_start_page.location }}"
              - "Pi-hole DNS (local record): {{ pihole_dns_local_record.stdout }}"
              - "Pi-hole DNS (denied name): {{ pihole_dns_blocked.stdout }}"
              - "Pi-hole gravity database: {{ pihole_verify_data_path }}/gravity.db"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Pi-hole systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=pihole.service
          register: pihole_service_log
          changed_when: false

        - name: Show the Pi-hole systemd service log
          ansible.builtin.debug:
            var: pihole_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Pi-hole verification failed. The systemd service log is printed above."
