---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: pihole-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker inside the instance stores images via containerd. Its storage
      # cannot use overlay on top of the instance's own overlay filesystem, so a
      # volume puts it on a real filesystem.
      - /var/lib/containerd
    # Remove volumes along with the instance, so that local runs do not leave
    # gigabytes behind.
    keep_volumes: false
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        pihole_debug_service_enabled: false
        pihole_restarts_check_enabled: true

        # Variables for Pi-hole
        #
        # Deliberately not the image's own 1000:1000, so that Pi-hole running as
        # this user can only be the role's doing.
        pihole_uid: 1873
        pihole_gid: 1873

        pihole_hostname: pihole.molecule.local

        # A non-root path prefix exercises FTLCONF_webserver_paths_prefix
        # (templates/env.j2) and the strip-prefix middleware (templates/labels.j2).
        pihole_path_prefix: /pihole-ui

        # Bound to the loopback interface of the test container only. Nothing
        # is published to the machine running Molecule, so two scenarios can
        # run side by side without fighting over a port.
        pihole_container_http_host_bind_port: "127.0.0.1:18080"

        # Not Pi-hole's own 80, so that Pi-hole answering at all can only come
        # from FTLCONF_webserver_port (templates/env.j2).
        pihole_container_http_port: 8282

        # Nothing else in the test container listens on 53 (systemd-resolved is
        # not running there), so the real DNS port can be used.
        pihole_container_dns_tcp_bind_port: "127.0.0.1:53"

        pihole_container_labels_traefik_enabled: true

        # Neither the role's default of UTC nor the test host's zone, so that the
        # timezone the container ends up in can only have come from
        # templates/env.j2.
        pihole_environment_variables_tz: Asia/Tokyo

        pihole_environment_variables_ftlconf_webserver_api_password: molecule-password

        # A local DNS record, which Pi-hole answers by itself, without an
        # upstream DNS server or internet access. Answering it at all also
        # proves that the additional environment variables reach Pi-hole.
        pihole_environment_variables_additional_variables: |
          FTLCONF_dns_hosts=203.0.113.10 molecule.test
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
